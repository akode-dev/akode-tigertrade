name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild Akode.TigerTrade.slnx
          /p:Configuration=Release
          "/p:Platform=Any CPU"
          /m
          /v:minimal

      - name: Verify artifact
        shell: pwsh
        run: |
          $dll = "src/Akode.TigerTrade.Indicators/bin/Release/Akode.TigerTrade.Indicators.dll"
          if (-not (Test-Path $dll)) { throw "Build artifact not found: $dll" }
          $size = (Get-Item $dll).Length
          Write-Host "Build OK: $dll ($size bytes)"
